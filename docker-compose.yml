# Opcional: corre la app (Vite + Worker) en Docker para no instalar Node en Windows.
# Supabase ya corre en Docker vía `pnpm db:start` (CLI). Recomendado: modo nativo (más rápido en Windows).
services:
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    ports:
      - '5273:5273'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    # El navegador habla con Supabase en 127.0.0.1:54421 (VITE_SUPABASE_URL de .env.local).
    # El Worker corre dentro del contenedor: añadir a `.dev.vars` la línea
    #   SUPABASE_URL=http://host.docker.internal:54421
    # (.dev.vars sobrescribe los `vars` de wrangler.jsonc).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  node_modules:
