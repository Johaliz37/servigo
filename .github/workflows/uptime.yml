name: uptime

# Monitor externo gratuito (fase 13 §5): cada hora comprueba la plataforma y la BD
# (`/api/health?db=1`). Si falla, GitHub avisa por correo a quien editó por última vez este
# cron (Settings → Notifications → Actions: «Send notifications for failed workflows only»).
# Como keepalive, GitHub lo desactiva tras 60 días sin commits en el repo (docs/runbook.md).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plataforma y base de datos
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 30 "https://servigo.roquintech.com/api/health?db=1"
      - name: Ruta comodín (404 de tenant inexistente = el Worker de Servigo responde)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "https://uptime-no-existe.roquintech.com/")
          echo "HTTP $code"
          test "$code" = 404
