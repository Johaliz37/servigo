<!doctype html>
<html lang="es">
  <body
    style="margin: 0; padding: 24px; background: #f5f5f5; font-family: Arial, Helvetica, sans-serif; color: #171717"
  >
    <table
      role="presentation"
      width="100%"
      style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px"
    >
      <tr>
        <td>
          <h1 style="margin: 0 0 16px; font-size: 20px">Tu enlace de acceso</h1>
          <p style="margin: 0 0 24px; line-height: 1.5">
            Abre el enlace para entrar a Servigo. Si te invitaron a una empresa nueva, desde ahí aceptas la invitación.
          </p>
          <p style="margin: 0 0 24px">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #171717;
                color: #ffffff;
                text-decoration: none;
                padding: 12px 20px;
                border-radius: 6px;
              "
              >Entrar a Servigo</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; color: #737373; line-height: 1.5">
            El enlace vence en 24 horas y solo se puede usar una vez. Si no lo pediste, ignora este correo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
